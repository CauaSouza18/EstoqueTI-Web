# =========================================================
# EstoqueTI-Web - configuracao padrao (Etapa 9)
# =========================================================
# Banco H2 em arquivo: nao exige instalar/configurar um SGBD externo para
# rodar e avaliar o projeto - os dados persistem em ./data/estoqueti.mv.db
# entre execucoes. Para usar MySQL (como no projeto desktop original),
# veja as propriedades comentadas mais abaixo.
spring.datasource.url=jdbc:h2:file:./data/estoqueti;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update: cria/ajusta as tabelas automaticamente a partir das entidades JPA
# (Categoria, Produto, Fornecedor, MovimentacaoEstoque, NotaFiscal, Usuario)
# sem apagar dados existentes a cada start.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console web do H2, util para inspecionar as tabelas durante o
# desenvolvimento/avaliacao: http://localhost:8080/h2-console
# JDBC URL para conectar no console: jdbc:h2:file:./data/estoqueti
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# ---------------------------------------------------------
# Alternativa: MySQL (mesmo banco usado no projeto desktop original).
# Para usar, comente o bloco H2 acima e descomente as linhas abaixo,
# ajustando usuario/senha/host conforme seu ambiente. O schema.sql do MySQL
# do projeto original (Etapas 1-5) pode ser reaproveitado, ou deixe o
# Hibernate criar as tabelas automaticamente como faz aqui com o H2.
