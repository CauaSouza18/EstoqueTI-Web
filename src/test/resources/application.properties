# Perfil de teste: H2 em memoria, recriado do zero a cada execucao
# (create-drop), sem seed de dados - cada teste organiza seus proprios
# dados via @BeforeEach / repositorios injetados.
spring.datasource.url=jdbc:h2:mem:estoqueti_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
